<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Users — Admin TrainMS</title>
  <link rel="stylesheet" href="../css/variables.css"/>
  <link rel="stylesheet" href="../css/base.css"/>
  <link rel="stylesheet" href="../css/components.css"/>
</head>
<body>
  <div class="bg-noise"></div>
  <div class="page-wrapper">

    <nav class="navbar">
      <a href="dashboard.html" class="navbar-brand">
        <div class="brand-icon">🚂</div>
        <span class="brand-name">Train<em>MS</em></span>
        <span class="badge badge-blue" style="font-size:.65rem;">ADMIN</span>
      </a>
      <div class="navbar-actions">
        <div id="navUser"></div>
        <button id="logoutBtn" class="btn btn-ghost btn-sm">Logout</button>
      </div>
    </nav>

    <div class="with-sidebar">
      <aside class="sidebar">
        <div class="sidebar-label">Overview</div>
        <a href="dashboard.html" class="sidebar-item"><span class="si-icon">📊</span>Dashboard</a>
        <div class="sidebar-label">Management</div>
        <a href="trains.html"   class="sidebar-item"><span class="si-icon">🚂</span>Trains</a>
        <a href="stations.html" class="sidebar-item"><span class="si-icon">🚉</span>Stations</a>
        <a href="seats.html"    class="sidebar-item"><span class="si-icon">💺</span>Seats</a>
        <div class="sidebar-label">Reports</div>
        <a href="users.html"    class="sidebar-item active"><span class="si-icon">👥</span>Users</a>
        <a href="bookings.html" class="sidebar-item"><span class="si-icon">🎫</span>Bookings</a>
      </aside>

      <main class="main-area">
        <div class="page-head-row">
          <div>
            <h1 class="page-title">Users 👥</h1>
            <p class="page-sub" id="totalU"></p>
          </div>
        </div>

        <!-- Table -->
        <div class="table-box">
          <div id="userTable">
            <div class="empty"><div class="spinner spinner-lg"></div></div>
          </div>
        </div>

        <div id="pagination"></div>
      </main>
    </div>
  </div>

  <!-- Delete User Modal -->
  <div class="modal-overlay" id="uDelMod">
    <div class="modal" style="max-width:360px;">
      <div class="modal-head">
        <h2 class="modal-title">Delete User</h2>
        <button class="modal-close" data-close="uDelMod">✕</button>
      </div>
      <div class="alert alert-error">
        ⚠️ Delete this user? Their bookings and data will also be removed.
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-close="uDelMod">Cancel</button>
        <button class="btn btn-danger" id="uDelBtn">
          <span class="btn-text">Delete User</span>
        </button>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/pages/admin/users.js"></script>
</body>
</html>
