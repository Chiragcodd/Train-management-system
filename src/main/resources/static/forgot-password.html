<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password — TrainMS</title>
  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/components.css"/>
</head>
<body>
  <div class="bg-noise"></div>
  <div class="auth-page page-wrapper">
    <div class="auth-box fade-up">

      <div class="auth-brand">
        <div class="auth-icon">🔐</div>
        <div class="auth-title">Forgot Password?</div>
        <div class="auth-subtitle">Enter your email to receive an OTP</div>
      </div>

      <div id="alertBox"></div>

      <!-- Step 1: Email daalo -->
      <div id="step1">
        <div class="form-group">
          <label class="form-label" for="email">Registered Email</label>
          <input type="email" id="email" class="form-control"
                 placeholder="Enter your registered email"/>
        </div>
        <button id="sendOtpBtn" class="btn btn-primary btn-full btn-lg">
          <span class="btn-text">Send OTP →</span>
        </button>
      </div>

      <!-- Step 2: OTP + New Password -->
      <div id="step2" style="display:none;">
        <div class="form-group">
          <label class="form-label">OTP</label>
          <input type="text" id="otp" class="form-control"
                 placeholder="Enter 6-digit OTP from email"
                 maxlength="6"/>
          <div style="font-size:.75rem;color:var(--text-muted);margin-top:4px;">
            ⏱ OTP valid for 10 minutes
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input type="password" id="newPassword" class="form-control"
                 placeholder="Min 8 chars, uppercase, number, special char"/>
          <div style="font-size:.75rem;color:var(--text-muted);margin-top:4px;">
            Min 8 chars · uppercase · lowercase · number · special char (@$!%*?&)
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <input type="password" id="confirmPassword" class="form-control"
                 placeholder="Re-enter new password"/>
        </div>
        <button id="resetBtn" class="btn btn-primary btn-full btn-lg">
          <span class="btn-text">Reset Password →</span>
        </button>
        <button id="resendOtpBtn" class="btn btn-ghost btn-full"
                style="margin-top:8px;font-size:.82rem;">
          Resend OTP
        </button>
      </div>

      <div class="auth-sep"><span>or</span></div>
      <p class="auth-footer">
        Remember your password? <a href="index.html">Sign In</a>
      </p>

    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/forgot-password.js"></script>
</body>
</html>
