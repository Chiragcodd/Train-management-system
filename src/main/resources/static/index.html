<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — TrainMS</title>
  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/components.css"/>
</head>
<body>
  <div class="bg-noise"></div>
  <div class="auth-page page-wrapper">
    <div class="auth-box fade-up">
      <div class="auth-brand">
        <div class="auth-icon">🚂</div>
        <div class="auth-title">Welcome back</div>
        <div class="auth-subtitle">Sign in to your TrainMS account</div>
      </div>
      <div id="alertBox"></div>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-control"
                 placeholder="Enter your username"
                 required autocomplete="username"/>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control"
                 placeholder="Enter your password"
                 required autocomplete="current-password"/>
        </div>
        <button type="submit" id="loginBtn" class="btn btn-primary btn-full btn-lg">
          <span class="btn-text">Sign In →</span>
        </button>
      </form>
      <div class="auth-sep"><span>or</span></div>
      <p class="auth-footer">
        Don't have an account? <a href="register.html">Create one</a>
      </p>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
