<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Profile — TrainMS</title>
  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/components.css"/>
</head>
<body>
  <div class="bg-noise"></div>
  <div class="page-wrapper">

    <nav class="navbar">
      <a href="dashboard.html" class="navbar-brand">
        <div class="brand-icon">🚂</div>
        <span class="brand-name">Train<em>MS</em></span>
      </a>
      <div class="navbar-nav">
        <a href="dashboard.html" class="nav-item"><span class="ni">🏠</span>Home</a>
        <a href="search.html"    class="nav-item"><span class="ni">🔍</span>Search</a>
        <a href="bookings.html"  class="nav-item"><span class="ni">🎫</span>Bookings</a>
        <a href="pnr.html"       class="nav-item"><span class="ni">📋</span>PNR</a>
        <a href="profile.html"   class="nav-item active"><span class="ni">👤</span>Profile</a>
      </div>
      <div class="navbar-actions">
        <div id="navUser"></div>
        <button id="logoutBtn" class="btn btn-ghost btn-sm">Logout</button>
      </div>
    </nav>

    <div class="container-md" style="margin-top:8px;">

      <div class="page-head">
        <h1 class="page-title">My Profile 👤</h1>
        <p class="page-sub">View and update your account details</p>
      </div>

      <!-- Avatar Card -->
      <div class="card card-accent" style="margin-bottom:20px;text-align:center;padding:32px;">
        <div id="profileAvatar" style="width:72px;height:72px;border-radius:50%;
          background:linear-gradient(135deg,var(--blue),var(--mint));
          color:#fff;font-size:1.6rem;font-weight:700;
          display:flex;align-items:center;justify-content:center;
          margin:0 auto 14px;">—</div>
        <div id="profileName"     style="font-size:1.2rem;font-weight:700;color:var(--text-primary);">—</div>
        <div id="profileUsername" style="font-size:.8rem;color:var(--text-muted);font-family:var(--mono);margin-top:4px;">—</div>
        <div id="profileRole"     style="margin-top:10px;"></div>
      </div>

      <!-- Update Profile -->
      <div class="card" style="margin-bottom:20px;">
        <h3 class="section-title">Update Profile</h3>
        <div id="profileAlert"></div>
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="pName" class="form-control" placeholder="Your full name"/>
        </div>
        <div class="form-row">
          <div class="form-group" style="margin:0;">
            <label class="form-label">Email</label>
            <input type="email" id="pEmail" class="form-control" placeholder="your@email.com"/>
          </div>
          <div class="form-group" style="margin:0;">
            <label class="form-label">Mobile Number</label>
            <input type="text" id="pMobile" class="form-control" placeholder="10-digit mobile"/>
          </div>
        </div>
        <div class="form-group" style="margin-top:14px;">
          <label class="form-label">Username</label>
          <input type="text" id="pUsername" class="form-control" placeholder="username"/>
          <div style="font-size:.75rem;color:var(--text-muted);margin-top:4px;">
            ⚠️ Changing username will log you out
          </div>
        </div>
        <button id="updateProfileBtn" class="btn btn-primary" style="margin-top:8px;">
          Save Changes
        </button>
      </div>

      <!-- Change Password -->
      <div class="card">
        <h3 class="section-title">Change Password 🔐</h3>
        <div id="passwordAlert"></div>
        <div class="form-group">
          <label class="form-label">Current Password</label>
          <input type="password" id="pCurrentPass" class="form-control"
                 placeholder="Enter current password"/>
        </div>
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input type="password" id="pNewPass" class="form-control"
                 placeholder="Min 8 chars, uppercase, number, special char"/>
          <div style="font-size:.75rem;color:var(--text-muted);margin-top:4px;">
            Min 8 chars · uppercase · lowercase · number · special char (@$!%*?&)
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <input type="password" id="pConfirmPass" class="form-control"
                 placeholder="Re-enter new password"/>
        </div>
        <button id="changePassBtn" class="btn btn-primary" style="margin-top:8px;">
          Change Password
        </button>
      </div>

    </div>
  </div>

  <!-- Logout Modal -->
  <div class="modal-overlay" id="logoutModal">
    <div class="modal" style="max-width:380px;">
      <div class="modal-head">
        <h2 class="modal-title">Logout</h2>
        <button class="modal-close" data-close="logoutModal">✕</button>
      </div>
      <div style="padding:0 0 16px;">
        <p style="color:var(--text-secondary);font-size:.9rem;">Are you sure you want to logout?</p>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" data-close="logoutModal">Cancel</button>
        <button class="btn btn-danger" id="confirmLogoutBtn">Yes, Logout</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/profile.js"></script>
</body>
</html>
