<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — TrainMS</title>
  <link rel="stylesheet" href="css/variables.css"/>
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/components.css"/>
</head>
<body>
  <div class="bg-noise"></div>
  <div class="auth-page page-wrapper">
    <div class="auth-box fade-up" style="max-width:500px;">
      <div class="auth-brand">
        <div class="auth-icon">🚂</div>
        <div class="auth-title">Create account</div>
        <div class="auth-subtitle">Join TrainMS and start booking journeys</div>
      </div>
      <div id="alertBox"></div>
      <form id="regForm" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <input type="text" id="name" class="form-control"
                   placeholder="Chirag Wani" required/>
          </div>
          <div class="form-group">
            <label class="form-label" for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" class="form-control"
                   placeholder="9876543210" required/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control"
                 placeholder="you@example.com" required/>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" class="form-control"
                   placeholder="chirag_123" required/>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-control"
                   placeholder="Min 8 chars" required/>
          </div>
        </div>
        <p class="form-hint" style="margin-top:-8px; margin-bottom:14px;">
          Password: min 8 chars with uppercase, lowercase, number &amp; special character
        </p>
        <button type="submit" id="regBtn" class="btn btn-primary btn-full btn-lg">
          <span class="btn-text">Create Account →</span>
        </button>
      </form>
      <p class="auth-footer">
        Already have an account? <a href="index.html">Sign in</a>
      </p>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/register.js"></script>
</body>
</html>
